    <text x="24" y="122" fill="#f4f1ff" class="aroma">LAVANDA</text>
    <text x="24" y="154" fill="#f4f1ff" class="aroma">CELESTIAL</text>
    <text x="24" y="184" fill="#f4f1ff" class="micro">INCENSO HEALS</text>
    <path d="M-5 310 C120 350 52 445 190 510 M-5 344 C105 374 58 470 195 538 M-5 378 C92 401 66 494 196 568" class="hair" stroke="#c9c9ee"/>
