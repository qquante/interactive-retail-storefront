<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" role="img" aria-labelledby="title desc">
  <title id="title">HEAL — sistema conceitual de embalagem Coreografia do ar</title>
  <desc id="desc">Prancha vetorial com as cinco frentes e o mapa de todas as faces da caixa. Conceito, não faca de produção.</desc>
  <defs>
    <style>
      .bg{fill:#121514}.paper{fill:#ebe8df}.ink{fill:#151716}.muted{fill:#6d726d}.hair{fill:none;stroke-width:2}.hair2{fill:none;stroke-width:1;opacity:.55}.fold{fill:none;stroke:#636862;stroke-width:1.5;stroke-dasharray:8 7}.cut{stroke:#c8cac4;stroke-width:2}.micro{font:500 12px Arial,sans-serif;letter-spacing:2px}.small{font:500 15px Arial,sans-serif;letter-spacing:2.5px}.brand{font:600 18px Arial,sans-serif;letter-spacing:5px}.aroma{font:500 29px Georgia,serif;letter-spacing:1px}.note{font:400 16px Arial,sans-serif}.section{font:600 21px Arial,sans-serif;letter-spacing:1px}
    </style>
    <pattern id="cnl" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M-4 18 L18 -4 M5 22 L22 5" stroke="#efb085" stroke-width="2"/></pattern>
    <pattern id="lvc" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.8" fill="#c9c9ee"/></pattern>
    <pattern id="mra" width="22" height="22" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="15" height="15" fill="#a45f69"/><rect x="5" y="5" width="17" height="17" fill="#541f28"/></pattern>
    <pattern id="olb" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M5 0 V20 M14 0 V20" stroke="#c6902e" stroke-width="2"/></pattern>
    <pattern id="alc" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M3 4 L12 10 L3 16" fill="none" stroke="#9fcb72" stroke-width="2"/></pattern>
  </defs>

  <rect class="bg" width="1600" height="980"/>
  <text x="62" y="62" fill="#f3f1e9" class="section">HEAL — COREOGRAFIA DO AR</text>
  <text x="62" y="91" fill="#9da49e" class="note">ARTE CONCEITUAL V2 • NÃO É FACA DE PRODUÇÃO • MEDIDAS E DADOS [A VALIDAR]</text>

  <!-- CANELA -->
  <g transform="translate(62 135)">
    <rect width="190" height="650" rx="4" fill="#a54127"/>
    <rect width="190" height="650" rx="4" fill="url(#cnl)" opacity=".13"/>
    <text x="24" y="43" fill="#fff4e9" class="brand">HEAL</text>
    <text x="24" y="132" fill="#fff4e9" class="aroma">CANELA</text>
    <text x="24" y="160" fill="#fff4e9" class="micro">INCENSO HEALS</text>
    <path d="M-10 390 C35 330 95 340 188 244 M-8 432 C65 350 106 375 205 278 M-5 474 C82 385 126 405 210 318" class="hair" stroke="#efb085"/>
    <path d="M45 405 C80 365 118 370 155 340 C125 420 105 492 65 545 C48 518 39 465 45 405Z" fill="#171917"/>
    <text x="24" y="615" fill="#fff4e9" class="micro">CONTEÚDO [A VALIDAR]</text>
    <rect y="662" width="190" height="56" rx="3" fill="url(#cnl)"/>
    <text y="749" fill="#ddd9cf" class="small">CNL / PULSO</text>
  </g>

