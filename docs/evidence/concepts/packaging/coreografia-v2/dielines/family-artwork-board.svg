    <text x="24" y="132" fill="#f7e7df" class="aroma">MIRRA</text>
    <text x="24" y="160" fill="#f7e7df" class="micro">INCENSO HEALS</text>
    <path d="M10 306 C168 236 170 427 42 397 C-30 380 5 284 120 332 C212 370 148 540 40 510 C-24 492 5 420 92 441 C153 455 156 566 82 594" class="hair" stroke="#ba7378"/>
